spring:
  application:
    name: backend

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  sql:
    init:
      mode: never

dex:
  blockchain:
    mode: ${DEX_BLOCKCHAIN_MODE}
    deployment-id: ${DEX_DEPLOYMENT_ID}
    rpc-url: ${DEX_RPC_URL:}
    expected-chain-id: ${DEX_EXPECTED_CHAIN_ID:}
    dex-address: ${DEX_CONTRACT_ADDRESS:}
    market-registry-address: ${DEX_MARKET_REGISTRY_ADDRESS:}
    deployment-block: ${DEX_DEPLOYMENT_BLOCK:}

  indexer:
    enabled: ${DEX_INDEXER_ENABLED:true}
    poll-interval: ${DEX_INDEXER_POLL_INTERVAL:2s}
    confirmation-depth: ${DEX_INDEXER_CONFIRMATION_DEPTH:0}
    block-batch-size: ${DEX_INDEXER_BLOCK_BATCH_SIZE:500}

  matcher:
    enabled: ${DEX_MATCHER_ENABLED:false}
    poll-interval: ${DEX_MATCHER_POLL_INTERVAL:2s}
    ineligibility-duration: ${DEX_MATCHER_INELIGIBILITY_DURATION:30s}

  executor:
    private-key: ${DEX_EXECUTOR_PRIVATE_KEY:}
    poll-interval: ${DEX_EXECUTOR_POLL_INTERVAL:2s}

  api:
    cors-origins: ${DEX_CORS_ORIGINS:http://localhost:5173}
